name: Validate pull requests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up contract checker
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The private backend compares its live fixture to this public frontend in backend CI.
      # Contract changes require paired backend qualification before updating this reference.
      - name: Verify qualified backend contract reference and rejection tests
        run: |
          python -m unittest discover -s tools/qualification -p test_contract_gate.py
          python tools/qualification/verify_pinned_contract.py tools/qualification/fixtures/customer-runtime-http.json tools/qualification/fixtures/customer-runtime-backend-reference.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
