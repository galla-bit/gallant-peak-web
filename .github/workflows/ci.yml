name: Validate pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test artifact exporter
        run: node --test tools/retailer-harness/export-frontend.node.mjs
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

      - name: Validate separate complete-checkout artifact roles
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node tools/retailer-harness/export-frontend.mjs --checkout "$GITHUB_WORKSPACE" --expected-commit "$EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/retailer-default" --preview false
          node tools/retailer-harness/export-frontend.mjs --checkout "$GITHUB_WORKSPACE" --expected-commit "$EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/retailer-preview" --preview true
